<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幸運轉盤｜看·健</title>

<!--
  彈窗版轉盤 —— 給 Size = Tall 的 LIFF app 用(pagegame / 2011132698-6J9iB9YG)。

  刻意不共用 index.html:那一包是 172 KB(auth/report/analyze/admin/features…),
  塞進彈窗會先給使用者一片白畫面,小遊戲的體感就沒了。這裡只載 LIFF SDK 與
  Supabase,其餘自帶。

  中什麼獎完全由 rpc_draw_lottery 決定,轉盤只把伺服器給的結果轉到定位。
  順序不能反 —— 反過來等於把中獎邏輯交給使用者的瀏覽器。
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root{
    --deep:#0D5C63; --primary:#22C1C3; --pale:#E6F7F8;
    --soft:#8FA3B8; --mid:#41565F; --bg:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--deep);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    text-align:center;
  }
  h1{font-size:19px;margin:0 0 2px;letter-spacing:1px}
  .sub{font-size:12.5px;color:var(--mid);margin-bottom:14px;line-height:1.6}
  .stage{position:relative;width:260px;height:260px;margin-bottom:14px}
  canvas{width:260px;height:260px;transition:transform 4.2s cubic-bezier(.17,.67,.24,1)}
  .pin{
    position:absolute;top:-4px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:20px solid var(--deep);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  }
  .result{font-size:14px;min-height:22px;margin-bottom:12px;font-weight:700}
  .result.win{color:var(--primary)}
  .result.err{color:#D9534F;font-weight:400}
  .btn{
    display:block;width:100%;max-width:300px;border:none;border-radius:999px;
    padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;margin-bottom:9px;
    font-family:inherit;text-decoration:none;
  }
  .btn-main{background:var(--deep);color:#fff}
  .btn-main:disabled{background:#C8D4DA;color:#fff}
  .btn-sub{background:var(--pale);color:var(--deep)}
  .btn-ghost{background:none;color:var(--soft);font-weight:400;font-size:13px}
  .hidden{display:none}
  .note{font-size:11px;color:var(--soft);line-height:1.7;margin-top:6px}

  /* 圖例:窄到標不上字的獎品在這裡才看得到 */
  #legend{width:100%;max-width:300px;margin:0 0 14px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
  .dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .nm{color:var(--deep);font-weight:700}

  /* 獎品保留區 */
  .vault{width:100%;max-width:300px;margin-top:22px;text-align:left}
  .vault h2{
    font-size:13px;letter-spacing:.12em;color:var(--deep);
    margin:0 0 10px;font-weight:700;text-align:center;
  }
  .prize{
    display:flex;align-items:center;gap:10px;padding:11px 12px;
    background:var(--pale);border-radius:10px;margin-bottom:8px;
  }
  .prize-name{font-size:14px;font-weight:700;color:var(--deep);line-height:1.4}
  .prize-date{font-size:11px;color:var(--soft)}
  .pill{
    margin-left:auto;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:100px;white-space:nowrap;flex:0 0 auto;
  }
  .pill.wait{background:#FFF3DC;color:#8A5A00}
  .pill.done{background:#E4F3EA;color:#1B7F4D}
  .vault-empty{font-size:12.5px;color:var(--soft);text-align:center;padding:6px 0}
</style>
</head>
<body>

<h1>幸運轉盤</h1>
<div class="sub" id="status">載入中…</div>

<div class="stage">
  <canvas id="wheel" width="520" height="520"></canvas>
  <div class="pin"></div>
</div>

<div id="legend"></div>

<div class="result" id="result"></div>

<button class="btn btn-main" id="spin" disabled>準備中…</button>
<a class="btn btn-sub hidden" id="angel" target="_blank" rel="noopener">聯絡大天使兌獎</a>
<button class="btn btn-ghost" onclick="closeGame()">關閉</button>

<div class="note">轉盤上一格就是一份獎品，格數就是中獎機率。<br>結果由伺服器決定，兌獎方式將由專人與你聯繫。</div>

<div class="vault" id="vault" hidden>
  <h2>🎁 我的獎品</h2>
  <div id="vault-list"></div>
</div>

<script>
const LIFF_ID   = '2011132698-6J9iB9YG';           // pagegame（Tall）
const SB_URL    = 'https://wcemkmwrlvijxxwybrgs.supabase.co';
const SB_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZW1rbXdybHZpanh4d3licmdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzA1NDgsImV4cCI6MjA5MDcwNjU0OH0.Ji557wlvrS7YgflU9ANEm9To6AXLc47EFPaMHTgGARg';
const ANGEL_URL = 'https://line.me/ti/p/ZC-w2BuPoi';
// 顏色綁在品項上,不是綁在順序上 —— 獎品抽完會從清單消失,
// 靠 index 配色會讓剩下的獎品每次都換顏色。
const PRIZE_COLORS = {
  '紅橙飲':               '#EF6C2A',
  'XS 提神能量飲':        '#22C1C3',
  '個人健康全面高級諮詢': '#0D5C63',
  '優質蛋白素':           '#4CAF50',
};
const FALLBACK = ['#4DA3E5','#0A7C7C','#5FD3D4','#2E86AB'];
const colorOf = (name, i) => PRIZE_COLORS[name] ?? FALLBACK[i % FALLBACK.length];

const sb = window.supabase.createClient(SB_URL, SB_ANON);
let prizes = [], angle = 0, busy = false;
// cells[i] = 第 i 格是哪一種獎品(存 prizes 的 index)。洗過牌,
// 不然 148 罐能量飲會連成一大塊,看起來就不像在抽。
let cells = [];

const $ = (id) => document.getElementById(id);

function closeGame() {
  // 在 LINE 裡就收起彈窗；在外部瀏覽器 closeWindow() 沒有作用，退回上一頁。
  if (window.liff?.isInClient?.()) liff.closeWindow();
  else history.length > 1 ? history.back() : window.close();
}

function say(msg, cls) {
  const el = $('result');
  el.textContent = msg || '';
  el.className = 'result' + (cls ? ' ' + cls : '');
}

// 把每一份獎品攤成一格,然後洗牌。
// 只調整獎品的排列順序沒有用 —— 148 罐能量飲還是會連成一大塊,
// 看起來就不像在抽。要打散就得打散到「份」這一層。
function buildCells() {
  cells = [];
  prizes.forEach((p, i) => {
    for (let k = 0; k < (p.stock || 0); k++) cells.push(i);
  });
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
}

// 一格就是一份獎品,格數就是中獎機率 —— 伺服器也是照剩餘數量抽的
// (rpc_draw_lottery),所以看到的比例就是真的比例。
function drawWheel() {
  const cv = $('wheel'), ctx = cv.getContext('2d');
  const total = cells.length;
  if (!total) return;

  const cx = cv.width / 2, cy = cv.height / 2, r = cx - 8;
  const unit = (Math.PI * 2) / total;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // 逐格畫。相鄰同色會自然連成一片,不同色就自己形成分界,
  // 不必再另外畫分隔線。
  for (let k = 0; k < total; k++) {
    const a0 = -Math.PI / 2 + k * unit;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a0 + unit + 0.002);   // 多 0.002 蓋掉相鄰縫隙
    ctx.fillStyle = colorOf(prizes[cells[k]].name, cells[k]);
    ctx.fill();
  }

  // 格線只在單格於外圈至少 3px 寬時才畫,不然會糊成一片深色
  const rimPerCell = (2 * Math.PI * r) / total;
  if (rimPerCell >= 3) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
    for (let k = 0; k < total; k++) {
      const a = -Math.PI / 2 + k * unit;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 44, cy + Math.sin(a) * 44);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.stroke();
    }
  }

  // 轉盤上不寫字 —— 格子洗開之後名稱會散在各處、還會上下顛倒。
  // 名稱交給下面的圖例。
  ctx.beginPath(); ctx.arc(cx, cy, 42, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#0D5C63'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#0D5C63';
  ctx.font = 'bold 30px "Noto Serif TC",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('抽', cx, cy);

  drawLegend();
}

// 圖例只認顏色與名稱。不寫機率也不寫份數 —— 那是營運資訊,
// 使用者要知道的是「有哪些獎品」。
function drawLegend() {
  $('legend').innerHTML = prizes.map((p, i) => `
    <div class="lg">
      <span class="dot" style="background:${colorOf(p.name, i)}"></span>
      <span class="nm">${p.name}</span>
    </div>`).join('');
}

function paintStatus(free, cost, points) {
  $('status').innerHTML = free > 0
    ? `你有 <b style="color:var(--primary)">${free}</b> 次免費機會，這次不扣點`
    : `每抽 ${cost} 點　·　目前 ${points} 點`;
  const btn = $('spin');
  const can = free > 0 || points >= cost;
  btn.disabled = !can;
  btn.textContent = free > 0 ? '免費抽一次' : (can ? `抽一次（${cost} 點）` : `積點不足（差 ${cost - points} 點）`);
}

async function load(opts = {}) {
  const { data, error } = await sb.rpc('rpc_my_lottery_status');
  if (error || !data) { say('資料載入失敗，請關閉重開。', 'err'); return; }
  prizes = data.prizes ?? [];
  if (!prizes.length) { $('status').textContent = '獎品補貨中，晚點再來'; return; }
  buildCells();
  drawWheel();
  paintStatus(data.free_tickets ?? 0, data.cost ?? 100, data.points ?? 0);
}

async function spin() {
  if (busy) return;
  busy = true;
  const btn = $('spin');
  btn.disabled = true; btn.textContent = '抽獎中…';
  say('');
  $('angel').classList.add('hidden');

  // 先問伺服器抽到什麼，再轉過去。順序不能反。
  const { data, error } = await sb.rpc('rpc_draw_lottery');
  if (error || !data?.ok) {
    busy = false; btn.disabled = false; btn.textContent = '再抽一次';
    say(data?.message ?? '抽獎失敗，請稍後再試。', 'err');
    return;
  }

  const idx = prizes.findIndex((p) => p.name === data.prize_name);
  const cv  = $('wheel');
  const total = cells.length;
  if (idx >= 0 && total > 0) {
    // 格子洗過牌,同一種獎品散在各處 —— 從屬於它的那些格子裡隨機挑一格轉過去。
    // 扇形從 12 點鐘開始畫,所以格子中心角度就是目標角度。
    const mine = [];
    for (let k = 0; k < total; k++) if (cells[k] === idx) mine.push(k);
    if (mine.length) {
      const cell   = mine[Math.floor(Math.random() * mine.length)];
      const center = (cell + 0.5) * (360 / total);
      angle += 360 * 5 + ((((360 - center) - (angle % 360)) % 360) + 360) % 360;
      cv.style.transform = `rotate(${angle}deg)`;
    }
  }

  setTimeout(() => {
    busy = false;
    say(`🎉 抽中「${data.prize_name}」`, 'win');
    $('angel').href = ANGEL_URL;
    $('angel').classList.remove('hidden');
    const left = data.free_tickets ?? 0;
    paintStatus(left, data.points_spent || 100, data.balance ?? 0);
    if (!$('spin').disabled) $('spin').textContent = left > 0 ? '免費再抽' : '再抽一次';
    // 庫存少了一份,格數要跟著少一格,不然下一轉的落點會對不上。
    load({ keepAngle: true });
    loadMyPrizes();
  }, idx >= 0 ? 4300 : 0);      // 對齊 CSS transition 的 4.2s
}

// 拿不到 ID token 幾乎都是同一件事:這個 LIFF app 的 Scopes 沒勾 openid。
// 每個 LIFF app 各自帶一份 scope —— 主 App 勾了不代表這支也有。
//
// 先試一次重新授權(舊的授權紀錄可能是加 openid 之前留下的),
// 用網址參數擋住第二次,不然會變成無限 login 迴圈。
function reauth() {
  const url = new URL(location.href);
  if (url.searchParams.get('r') === '1') {
    $('status').textContent = '';
    say('拿不到 LINE 身分 —— 這個 LIFF app 要勾選 openid 權限。', 'err');
    return;
  }
  url.searchParams.set('r', '1');
  try { liff.logout(); } catch (_) { /* 不在 LINE 裡就沒得登出 */ }
  liff.login({ redirectUri: url.toString() });
}

// 獎品保留區:抽中的都留在這裡,由專人確認領取後轉成「已領取」。
// 沒有這一頁的話,使用者關掉視窗就再也看不到自己抽到什麼。
async function loadMyPrizes() {
  const { data, error } = await sb.rpc('rpc_my_prizes');
  if (error || !data?.ok) return;

  const list = data.prizes ?? [];
  const box = $('vault');
  if (!list.length) { box.hidden = true; return; }
  box.hidden = false;

  $('vault-list').innerHTML = list.map((w) => {
    const done = w.status === 'claimed';
    const when = new Date(w.drawn_at).toLocaleDateString('zh-TW',
      { month: 'numeric', day: 'numeric' });
    return `<div class="prize">
      <div>
        <div class="prize-name">${w.name}</div>
        <div class="prize-date">${when} 抽中</div>
      </div>
      <span class="pill ${done ? 'done' : 'wait'}">${done ? '已領取' : '待領取'}</span>
    </div>`;
  }).join('');
}

async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

    const idToken = liff.getIDToken();
    if (!idToken) { reauth(); return; }

    // 走跟主 App 同一支 liff-auth —— 新的 LIFF app 在同一個 LINE Login channel，
    // ID token 的 aud 不變，後端一行都不用改。
    const res = await fetch(SB_URL + '/functions/v1/liff-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_token: idToken }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.ok) throw new Error(body.message ?? '登入失敗');

    const { error } = await sb.auth.verifyOtp({ token_hash: body.token_hash, type: 'magiclink' });
    if (error) throw new Error('登入失敗：' + error.message);

    await load();
    await loadMyPrizes();
  } catch (e) {
    console.error(e);
    $('status').textContent = '';
    say(e.message || '初始化失敗，請關閉重開。', 'err');
  }
}

$('spin').addEventListener('click', spin);
boot();
</script>
</body>
</html>
