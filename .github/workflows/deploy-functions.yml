name: ⚡ 部署 Supabase Edge Functions

# 為什麼要有這支:
# 這個專案已經反覆出現「正式環境的函式比 repo 新」—— challenge-push、
# cofounder-line 整支沒進 git,line-webhook 也漂移過好幾次。
# 根因是部署靠人工、而 repo 只是事後補記。改成 push 到 main 就自動部署,
# 正式環境永遠等於 main,漂移這個問題就不存在了。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '只部署這一支(留空 = 全部)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wcemkmwrlvijxxwybrgs

    steps:
      - name: ✅ 取得程式碼
        uses: actions/checkout@v4

      - name: 🔑 檢查 access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::缺少 SUPABASE_ACCESS_TOKEN。到 repo Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi

      - name: 🧰 安裝 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🦕 安裝 Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: 🔍 型別檢查
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "── $f"
            deno check "$f" || exit 1
          done

      - name: 🚀 部署
        run: |
          # LINE / LINE Pay / cron 這些外部來源不會帶 Supabase JWT,
          # 一定要 --no-verify-jwt,否則會在進到函式自己的驗簽之前就被擋掉。
          NO_JWT="line-webhook richmenu-setup liff-auth payment-fulfill tip-plan tip-push challenge-push"
          ONLY="${{ github.event.inputs.only }}"

          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            if [ -n "$ONLY" ] && [ "$ONLY" != "$name" ]; then continue; fi

            if echo "$NO_JWT" | grep -qw "$name"; then
              echo "── $name (--no-verify-jwt)"
              supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt
            else
              echo "── $name"
              supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            fi
          done

      - name: ✅ 完成
        run: echo "已部署到 https://$PROJECT_REF.supabase.co/functions/v1/"
