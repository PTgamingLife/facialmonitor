name: ⚡ 部署 Supabase Edge Functions

# 為什麼要有這支:
# 這個專案已經反覆出現「正式環境的函式比 repo 新」—— challenge-push、
# cofounder-line 整支沒進 git,line-webhook 也漂移過好幾次。
# 根因是部署靠人工、而 repo 只是事後補記。改成 push 到 main 就自動部署,
# 正式環境永遠等於 main,漂移這個問題就不存在了。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '只部署這一支(留空 = 全部)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wcemkmwrlvijxxwybrgs

    steps:
      - name: ✅ 取得程式碼
        uses: actions/checkout@v4

      - name: 🔑 檢查 access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::缺少 SUPABASE_ACCESS_TOKEN。到 repo Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi

      # ⚠️ 版本是釘死的。要升級必須經過擁有者確認,不要自己改這個數字。
      #
      # 原本寫 version: latest,等於每次部署都抓當下最新版。
      # 2026-11-09 就因此整批部署失敗:CLI 把部署改成要互動確認,
      # 而 Actions 的 stdout 不是終端機,第一支函式就 exit 1,12 支一支都沒上。
      # 沒有人改過任何東西 —— 它是自己長出來的。
      #
      # 3.1.0 是當天實測跑通的版本(--yes、--remote 都認得,12 支全部成功)。
      # 升級的做法:在這裡改版號 → 合併 → 看這一次的部署有沒有全綠。
      # 綠了才算數;沒綠就改回 3.1.0,因為舊版一定是好的。
      - name: 🧰 安裝 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
        env:
          # 釘版之後這支 action 仍會打 GitHub API 找對應的 release。
          # 未授權的請求用 runner 的共用 IP 計額度,尖峰時會 rate limit exceeded
          # —— run #6 就是這樣掛的,而且掛掉時正式環境會安靜地停在舊版,
          # 正是這條 pipeline 要防的事。帶 GITHUB_TOKEN 改用本 repo 的額度。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # setup-cli 不會印版號,只是解壓縮。印出來才查得到「那天跑的是哪一版」。
      # 釘版之後這行還有一個用途:確認實際裝到的真的是上面釘的那一版。
      - name: 🔎 CLI 版本
        run: |
          echo "釘住的版本:3.1.0"
          supabase --version

      - name: 🦕 安裝 Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: 🔍 型別檢查
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "── $f"
            deno check "$f" || exit 1
          done

      - name: 🚀 部署
        run: |
          # LINE / LINE Pay / cron 這些外部來源不會帶 Supabase JWT,
          # 一定要 --no-verify-jwt,否則會在進到函式自己的驗簽之前就被擋掉。
          NO_JWT="line-webhook richmenu-setup liff-auth payment-fulfill tip-plan tip-push challenge-push line-broadcast admin-api"
          ONLY="${{ github.event.inputs.only }}"

          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            if [ -n "$ONLY" ] && [ "$ONLY" != "$name" ]; then continue; fi

            # --yes 不能省:CLI 新版把部署改成要互動確認,
            # 而 Actions 的 stdout 不是終端機,它會直接停在
            # 「Confirmation required ... Nothing was changed」並 exit 1。
            # 這會在第一支函式就擋下來,等於整批都沒部署(run #28 就是這樣)。
            # --remote 取代 --project-ref:後者已被標記 deprecated,v4 會移除。
            # 不先換掉的話,等 v4 出來、setup-cli 自動抓到新版的那一天,
            # 部署會再死一次,症狀跟 run #28 一樣(整批都沒上)。
            if echo "$NO_JWT" | grep -qw "$name"; then
              echo "── $name (--no-verify-jwt)"
              supabase functions deploy "$name" --remote="$PROJECT_REF" --no-verify-jwt --yes
            else
              echo "── $name"
              supabase functions deploy "$name" --remote="$PROJECT_REF" --yes
            fi
          done

      - name: ✅ 完成
        run: echo "已部署到 https://$PROJECT_REF.supabase.co/functions/v1/"
